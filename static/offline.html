<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#146c43">
  <title>Offline | SokoTz</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f8f9fa; color: #183b2a; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(100%, 420px); text-align: center; }
    img { width: 80px; height: 80px; }
    h1 { margin: 20px 0 8px; font-size: 1.5rem; }
    p { margin: 0 0 20px; color: #52645a; }
    a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: 0 18px; border-radius: 6px; background: #146c43; color: #fff; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="/static/icon.svg" alt="SokoTz">
    <h1>You’re offline</h1>
    <p>Reconnect to the internet to browse the SokoTz marketplace.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
